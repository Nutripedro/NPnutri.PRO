    <script>
      // In AI Studio preview environment, HMR WebSocket is disabled (HMR: Disabled).
      // Safely ignore Vite HMR WebSocket connection notices without modifying native WebSocket constructor.
      (function() {
        function isViteHmrError(str) {
          if (!str || typeof str !== 'string') return false;
          return str.indexOf('WebSocket') !== -1 ||
                 str.indexOf('vite:ws') !== -1 ||
                 str.indexOf('failed to connect to websocket') !== -1 ||
                 str.indexOf('closed without opened') !== -1 ||
                 str.indexOf('SendBeforeConnectError') !== -1 ||
                 str.indexOf('send was called before connect') !== -1 ||
                 str.indexOf('invoke was called before connect') !== -1;
        }

        function filterViteArgs(args) {
          for (var i = 0; i < args.length; i++) {
            var a = args[i];
            var str = (a && (a.message || a.stack || String(a))) || '';
            if (isViteHmrError(str) || (args[0] === '[vite]' && isViteHmrError(String(a)))) {
              return true;
            }
          }
          return false;
        }

        function wrapConsole(cons) {
          if (!cons || cons.__vite_wrapped) return cons;
          var realError = cons.error;
          cons.error = function() {
            var args = Array.prototype.slice.call(arguments);
            if (filterViteArgs(args)) {
              return; // Suppress Vite HMR WebSocket disconnect notice as per environment constraints
            }
            return realError.apply(this, args);
          };
          cons.__vite_wrapped = true;
          return cons;
        }

        wrapConsole(window.console);

        var _console = window.console;
        try {
          Object.defineProperty(window, 'console', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _console;
            },
            set: function(newVal) {
              _console = wrapConsole(newVal);
            }
          });
        } catch (_) {}

        var _onerror = window.onerror;
        try {
          Object.defineProperty(window, 'onerror', {
            configurable: true,
            enumerable: true,
            get: function() { return _onerror; },
            set: function(handler) {
              _onerror = function(message, source, lineno, colno, error) {
                var str = String(message) + ' ' + String(error && error.message ? error.message : '');
                if (isViteHmrError(str)) {
                  return true;
                }
                if (typeof handler === 'function') {
                  return handler.apply(this, arguments);
                }
              };
            }
          });
        } catch (_) {}

        var _onunhandledrejection = window.onunhandledrejection;
        try {
          Object.defineProperty(window, 'onunhandledrejection', {
            configurable: true,
            enumerable: true,
            get: function() { return _onunhandledrejection; },
            set: function(handler) {
              _onunhandledrejection = function(event) {
                var reason = event && event.reason;
                var str = String(reason && reason.message ? reason.message : reason || '');
                if (isViteHmrError(str)) {
                  if (event && event.preventDefault) event.preventDefault();
                  return true;
                }
                if (typeof handler === 'function') {
                  return handler.apply(this, arguments);
                }
              };
            }
          });
        } catch (_) {}

        window.addEventListener('error', function(event) {
          var str = String(event && event.message ? event.message : '');
          if (isViteHmrError(str)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var str = String(reason && reason.message ? reason.message : reason || '');
          if (isViteHmrError(str)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
